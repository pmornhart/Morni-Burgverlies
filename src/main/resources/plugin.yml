name: MorniBurgverlies
version: '${project.version}'
main: de.moinmorni.burgverlies.BurgverliesPlugin
api-version: '1.21'
description: Burgverlies für das MoinMorni-Netzwerk – Koop-Verlies für 1 bis 4 mit Fallen, Schätzen und dem Kerkermeister.
authors: [MoinMorni]
website: https://moinmorni.net
# Läuft mit dem Netzwerk-Plugin (Sprache, Party, Statistik) und auch allein.
softdepend: [MoinMorni]

commands:
  burgverlies:
    description: Abstieg starten, Mitspieler suchen, Statistik, Spuren
    usage: /burgverlies [start|suchen] [leicht|normal|schwer] · /burgverlies stats|top|spuren|verlassen
    aliases: [bv, verlies, dungeon]
  verlassen:
    description: Suche oder Abstieg verlassen (zurück ins Torhaus)
    usage: /verlassen
    aliases: [leave, aufgeben]
  bvadmin:
    description: Verwaltung (info, neubauen, neuladen, debug, loesen, taler, start)
    usage: /bvadmin <info|neubauen|neuladen|debug|loesen|taler|start> [spieler] [anzahl|schwierigkeit]
    permission: moinmorni.burgverlies.admin

permissions:
  moinmorni.burgverlies.admin:
    description: Burgverlies verwalten und im Kreativmodus in der Burgverlies-Welt bauen
    default: op
